<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기억력 향상 프로그램 가입 신청서</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary-color: #4A90E2;
            --accent-color: #00A86B;
            --text-main: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }

        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            color: var(--text-main);
        }

        .main-wrapper {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .header-container {
            width: 100%;
            margin-bottom: 25px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            line-height: 0;
            background: #fff;
        }
    
        .title-img { width: 100%; height: auto; display: block; }

        .open-btn {
            width: 90%;
            padding: 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 22px;
            font-weight: 800;
            box-shadow: 0 5px 20px rgba(74, 144, 226, 0.3);
            transition: all 0.2s ease;
        }

        .open-btn:hover { transform: translateY(-2px); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: white;
            width: 92%;
            max-width: 430px;
            border-radius: 24px;
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }
        
        .form-group label {
            width: 85px; /* 라벨 너비 소폭 조정 */
            font-weight: 700;
            font-size: 16px;
            color: #555;
            text-align: left;
        }
        
        input[type="text"], 
        input[type="tel"] {
            flex: 1;
            padding: 14px;
            border: 1px solid #e1e1e1;
            border-radius: 10px;
            font-size: 16px;
            background: #fdfdfd;
            outline: none;
        }

        input:focus { border-color: var(--primary-color); }
        
        .radio-group {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        .radio-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 1px solid #e1e1e1;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .radio-item input { margin-right: 8px; }
        .radio-item:has(input:checked) {
            background: #eef5ff;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        
        .agreement-section {
            background: #f8f9fa;
            padding: 18px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid #edf0f2;
            text-align: left;
        }

        .btn-group { display: flex; gap: 12px; margin-top: 10px; }
        .btn-group button {
            flex: 1;
            padding: 18px;
            border-radius: 14px;
            border: none;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
        .submit-btn { background: var(--primary-color); color: white; }
        .close-btn { background: #f0f0f0; color: #666; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header-container">
            <!-- image_65d673.png 상단 배너 이미지 사용 -->
            <img src="img/SignUp_Main.jpg" alt="기억력 향상 프로그램 가입 신청서" class="title-img">
        </div>
        <button class="open-btn" onclick="toggleModal(true)">신청하기</button>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="header-container" style="box-shadow: none; margin-bottom: 25px;">
                <img src="img/SignUp.jpg" alt="신청서 타이틀" class="title-img">
            </div>

            <form id="applyForm">
                <div class="form-group">
                    <label>성명</label>
                    <input type="text" id="swal-input-name" placeholder="성함을 입력하세요" required>
                </div>

                <div class="form-group">
                    <label>성별</label>
                    <div class="radio-group">
                        <label class="radio-item"><input type="radio" name="gender" value="남" required> 남성</label>
                        <label class="radio-item"><input type="radio" name="gender" value="여"> 여성</label>
                    </div>
                </div>

                <!-- 나이 선택창을 출생년도 Edit창으로 변경 -->
                <div class="form-group">
                    <label>출생년도</label>
                    <input type="text" id="swal-input-birth" placeholder="예) 1975년" required>
                </div>

                <div class="form-group">
                    <label>전화번호</label>
                    <input type="tel" id="swal-input-phone" placeholder="010-0000-0000" maxlength="13" required>
                </div>

                <div class="form-group">
                    <label>주소</label>
                    <input type="text" id="swal-input-address" placeholder="상세주소를 입력하세요" required>
                </div>

                <div class="agreement-section">
                    <div style="font-size:15px; font-weight:bold; color:#333; margin-bottom:8px;">[개인정보처리동의서]</div>
                    <div style="font-size:13px; color:#777; line-height:1.6; word-break:keep-all;">
                        귀하는 본 설문에 개인정보(이름, 전화번호)가 활용되는 것에 동의합니다. 
                        처리된 개인정보는 프로그램 신청 목적으로만 사용됩니다.
                    </div>
                    
                    <label style="display:flex; align-items:center; margin-top:15px; cursor:pointer; font-size:16px; font-weight:bold;">
                        <input type="checkbox" id="swal-input-agree" required
                               style="margin-right:10px; width:20px; height:20px; accent-color:var(--accent-color);">
                        동의합니다
                    </label>
                </div>

                <div class="btn-group">
                    <button type="button" class="close-btn" onclick="toggleModal(false)">닫기</button>
                    <button type="submit" class="submit-btn">신청합니다</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById('modal');
            modal.style.display = show ? 'flex' : 'none';
            document.body.style.overflow = show ? 'hidden' : 'auto';
        }

        const phoneInput = document.getElementById('swal-input-phone');
        phoneInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^0-9]/g, '');
            if (val.length <= 3) e.target.value = val;
            else if (val.length <= 7) e.target.value = val.slice(0, 3) + '-' + val.slice(3);
            else e.target.value = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
        });

        document.getElementById('applyForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = {
                name: document.getElementById('swal-input-name').value,
                gender: document.querySelector('input[name="gender"]:checked').value,
                birthYear: document.getElementById('swal-input-birth').value, // 변경된 부분
                phone: document.getElementById('swal-input-phone').value,
                address: document.getElementById('swal-input-address').value
            };

            await sendData(formData);
        });

        async function sendData(formData) {
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxsTzHozsy1VJEiVmRjPKEPRrJ-9OBrFHK9zVIzMpy1jM43w0kpjhKdCgtQdhgQrh9g-A/exec';
            
            try {
                Swal.fire({ 
                    title: '제출 중...', 
                    allowOutsideClick: false, 
                    didOpen: () => Swal.showLoading() 
                });

                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                setTimeout(async () => {
                    await Swal.fire({
                        icon: 'success',
                        title: '신청 완료!',
                        html: `<b style="color:#4A90E2;">${formData.name}님</b>의 신청이 정상적으로 접수되었습니다.`,
                        confirmButtonColor: '#4A90E2',
                        confirmButtonText: '확인'
                    });
                    location.reload();
                }, 1000);
                
            } catch (error) {
                Swal.fire('오류 발생', '다시 시도해주세요.', 'error');
            }
        }
    </script>
</body>
</html>
